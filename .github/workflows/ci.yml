name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Syntactically valid dummy keys: the build must not need real secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_dummy

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build with canary secrets
        run: npm run build
        env:
          DATABASE_URL: postgres://canary:CANARY_DB_PASSWORD@db.invalid/app
          GEMINI_API_KEY: CANARY_GEMINI_KEY
      - name: Fail if a server secret reached the browser bundle
        run: |
          if grep -rq "CANARY_DB_PASSWORD\|CANARY_GEMINI_KEY" .next/static; then
            echo "::error::A server-only secret was found in the client bundle"; exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY -t qanda:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 -e CLERK_SECRET_KEY=$CLERK_SECRET_KEY \
            -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY qanda:ci
          for i in $(seq 1 30); do curl -fs localhost:3000/upgrade >/dev/null && break; sleep 1; done
          curl -fs localhost:3000/ | grep -q "Delta"
          curl -fsI localhost:3000/ | grep -qi "x-frame-options: DENY"
      - if: failure()
        run: docker logs app
